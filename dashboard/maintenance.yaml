type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    primary: Washing Machine Maintenance
    secondary: >-
      {% set sc = states('sensor.<machine_name>_check_up_maintenance_remaining_cycles') |
      int(-1) %} {% set ls =
      states('sensor.<machine_name>_limescale_maintenance_remaining_cycles') | int(-1) %} {%
      set fl = states('sensor.<machine_name>_filter_maintenance_remaining_cycles') | int(-1) %}
      {% set due = [] %} {% if sc == 0 %} {% set due = due + ['Full Check-up'] %}
      {% endif %} {% if ls == 0 %} {% set due = due + ['limescale'] %} {% endif %}
      {% if fl == 0 %} {% set due = due + ['Filter'] %} {% endif %} {% if due |
      length > 0 %}
        Attention required: {{ due | join(', ') }}
      {% else %}
        All good
      {% endif %}
    icon: mdi:washing-machine-alert
    badge_icon: >-
      {% set sc =
      states('sensor.<machine_name>_check_up_maintenance_remaining_cycles') |
      int(-1) %} {% set ls =
      states('sensor.<machine_name>_limescale_maintenance_remaining_cycles') | int(-1) %} {%
      set fl = states('sensor.<machine_name>_filter_maintenance_remaining_cycles') | int(-1) %}
      {% if sc == 0 or ls == 0 or fl == 0 %} mdi:alert-circle {% else %}
      mdi:check-circle {% endif %}
    badge_color: >-
      {% set sc =
      states('sensor.<machine_name>_check_up_maintenance_remaining_cycles') |
      int(-1) %} {% set ls =
      states('sensor.<machine_name>_limescale_maintenance_remaining_cycles') | int(-1) %} {%
      set fl = states('sensor.<machine_name>_filter_maintenance_remaining_cycles') | int(-1) %}
      {% if sc == 0 or ls == 0 or fl == 0 %} red {% else %} green {% endif %}
    color: >-
      {% set sc =
      states('sensor.<machine_name>_check_up_maintenance_remaining_cycles') |
      int(-1) %} {% set ls =
      states('sensor.<machine_name>_limescale_maintenance_remaining_cycles') | int(-1) %} {%
      set fl = states('sensor.<machine_name>_filter_maintenance_remaining_cycles') | int(-1) %}
      {% if sc == 0 or ls == 0 or fl == 0 %} red {% else %} green {% endif %}
    entity: sensor.<machine_name>_total_wash_cycles
    tap_action:
      action: more-info
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        icon: mdi:counter
        content: >-
          {% set v = states('sensor.<machine_name>_total_wash_cycles') |
          int(-1) %} {% if v >= 0 %}{{ v }} total cycles{% else %}—{% endif %}
        icon_color: grey
        tap_action:
          action: more-info
          entity: sensor.<machine_name>_total_wash_cycles
  - type: custom:mushroom-template-card
    primary: Full Check-up
    secondary: >-
      {% set v = states('sensor.<machine_name>_check_up_maintenance_remaining_cycles') |
      int(-1) %} {% if v == 0 %}Due now{% elif v >= 0 %}{{ v }} cycles
      remaining{% else %}—{% endif %}
    icon: mdi:stethoscope
    icon_color: >-
      {% set v = states('sensor.<machine_name>_check_up_maintenance_remaining_cycles') |
      int(-1) %} {% if v == 0 %} red {% elif v <= 10 %} orange {% else %} green
      {% endif %}
    entity: sensor.<machine_name>_check_up_maintenance_remaining_cycles
    tap_action:
      action: more-info
  - type: custom:mushroom-template-card
    primary: Limescale cleaning
    secondary: >-
      {% set v = states('sensor.<machine_name>_limescale_maintenance_remaining_cycles') |
      int(-1) %} {% if v == 0 %}Due now{% elif v >= 0 %}{{ v }} cycles
      remaining{% else %}—{% endif %}
    icon: mdi:water-opacity
    icon_color: >-
      {% set v = states('sensor.<machine_name>_limescale_maintenance_remaining_cycles') |
      int(-1) %} {% if v == 0 %} red {% elif v <= 10 %} orange {% else %} green
      {% endif %}
    entity: sensor.<machine_name>_limescale_maintenance_remaining_cycles
    tap_action:
      action: more-info
  - type: custom:mushroom-template-card
    primary: Filter clean
    secondary: >-
      {% set v = states('sensor.<machine_name>_filter_maintenance_remaining_cycles') | int(-1)
      %} {% if v == 0 %}Due now{% elif v >= 0 %}{{ v }} cycles remaining{%
      else %}—{% endif %}
    icon: mdi:filter-outline
    icon_color: >-
      {% set v = states('sensor.<machine_name>_filter_maintenance_remaining_cycles') | int(-1)
      %} {% if v == 0 %} red {% elif v <= 10 %} orange {% else %} green {% endif
      %}
    entity: sensor.<machine_name>_filter_maintenance_remaining_cycles
    tap_action:
      action: more-info
  - type: conditional
    conditions:
      - condition: or
        conditions:
          - condition: state
            entity: sensor.<machine_name>_check_up_maintenance_remaining_cycles
            state: "0"
          - condition: state
            entity: sensor.<machine_name>_limescale_maintenance_remaining_cycles
            state: "0"
    card:
      type: horizontal-stack
      cards:
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.<machine_name>_check_up_maintenance_remaining_cycles
              state: "0"
          card:
            type: custom:mushroom-template-card
            primary: Run Full Check-up
            icon: mdi:stethoscope
            color: red
            tap_action:
              action: more-info
              entity: button.<machine_name>_wash_full_checkup_button
            vertical: true
        - type: conditional
          conditions:
            - condition: state
              entity: sensor.<machine_name>_limescale_maintenance_remaining_cycles
              state: "0"
          card:
            type: custom:mushroom-template-card
            primary: Run Limescale Cleaning
            icon: mdi:water-remove
            color: red
            tap_action:
              action: more-info
              entity: button.<machine_name>_limescale_cleaning
            vertical: true
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: Reset Full Check-up
        icon: mdi:restore
        icon_color: grey
        tap_action:
          action: more-info
          entity: button.<machine_name>_check_up_maintenance_reset
        vertical: true
      - type: conditional
        conditions:
          - condition: state
            entity: button.<machine_name>_limescale_maintenance_reset
            state_not: unavailable
        card:
          type: custom:mushroom-template-card
          primary: Reset limescale
          icon: mdi:restore
          icon_color: grey
          tap_action:
            action: more-info
            entity: button.<machine_name>_limescale_maintenance_reset
          vertical: true
      - type: conditional
        conditions:
          - condition: state
            entity: button.<machine_name>_filter_maintenance_reset
            state_not: unavailable
        card:
          type: custom:mushroom-template-card
          primary: Reset filter
          icon: mdi:restore
          icon_color: grey
          tap_action:
            action: more-info
            entity: button.<machine_name>_filter_maintenance_reset
          vertical: true
  - type: horizontal-stack
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.<machine_name>_last_check_up_result
            state_not: unavailable
        card:
          type: custom:mushroom-template-card
          entity: sensor.<machine_name>_last_check_up_result
          primary: Check-up result
          secondary: >-
            {% set r = states('sensor.last_check_up_result') | lower %}
            {% if 'not run' in r or r == 'not_run' %} Never run
            {% elif 'ok' in r %} OK
            {% elif 'problem' in r %} Problem detected
            {% else %} {{ states('sensor.<machine_name>_last_check_up_result') }}
            {% endif %}
          icon: mdi:clipboard-check-outline
          tap_action:
            action: more-info
          color: >-
            {% set r = states('sensor.<machine_name>_last_check_up_result') | lower %}
            {% if 'ok' in r %} green
            {% elif 'problem' in r %} red
            {% else %} grey {% endif %}
          features_position: bottom
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.last_check_up
            state_not: unavailable
        card:
          type: custom:mushroom-template-card
          entity: sensor.<machine_name>_last_check_up
          primary: Last check-up
          secondary: >-
            {% set ts =
            states('sensor.<machine_name>_last_check_up') |
            as_timestamp(default=none) %} {% if ts %}{{ ts |
            timestamp_custom('%d/%m/%Y %H:%M') }}{% else %}—{% endif %}
          icon: mdi:clock-check-outline
          tap_action:
            action: more-info
          color: grey
          features_position: bottom
